name: Build TikiWare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TikiWare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP bulunamadı!"
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı, build.gradle aranıyor..."

            BUILD_FILE=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: Gradle projesi bulunamadı!"
              find project -maxdepth 3 -type f | head -100
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$BUILD_FILE")
          else
            PROJECT_ROOT=$(dirname "$GRADLEW")
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Gradle projesi: $PROJECT_ROOT"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_ROOT/gradlew"

      - name: Build
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew build --no-daemon

      - name: Show generated JARs
        run: |
          echo "Oluşturulan JAR dosyaları:"
          find "$PROJECT_ROOT" -type f -path '*/build/libs/*.jar' -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TikiWare-1.21.4-JAR
          path: ${{ env.PROJECT_ROOT }}/build/libs/*.jar
          if-no-files-found: error
