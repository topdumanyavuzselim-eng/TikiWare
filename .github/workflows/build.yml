name: Build TikiWare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        run: |
          ROOT=$(find project -name build.gradle -type f -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Build
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TikiWare-1.21.4-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
