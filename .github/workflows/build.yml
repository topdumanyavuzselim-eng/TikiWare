name: Build TikiWare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract source
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found."
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          ROOT=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            ROOT=$(find "$GITHUB_WORKSPACE/project" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit | xargs dirname)
          fi

          if [ -z "$ROOT" ]; then
            echo "Gradle project not found."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle project: $ROOT"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_ROOT/gradlew"

      - name: Build
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Find JAR files
        shell: bash
        run: |
          echo "Built JAR files:"
          find "$PROJECT_ROOT" -type f -path "*/build/libs/*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TikiWare-JAR
          path: ${{ env.PROJECT_ROOT }}/**/build/libs/*.jar
          if-no-files-found: error
